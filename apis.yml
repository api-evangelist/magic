name: Magic
description: >-
  Magic, Inc. is a Y Combinator-backed virtual assistant company that matches busy
  professionals, executives, and entrepreneurs with dedicated, vetted human assistants
  rather than AI bots. Through its Magic Match screening (assistants drawn from the top
  0.5% of applicants), Magic 24/7 backup coverage, and ongoing training, the service
  handles email and inbox management, calendar and scheduling, travel planning, customer
  support, research, data entry, and other recurring business and personal tasks. Magic
  is a consumer- and business-facing staffing/concierge service delivered through a web
  workspace; it does not publish a public developer API, OpenAPI specification, SDKs, or
  webhook surface at this time.
